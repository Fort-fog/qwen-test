name: boltun_client
description: BOLTUN — лёгкий приватный мессенджер для Redmi (Flutter client).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.0
  cryptography: ^2.7.0
  # Production secret storage (Android Keystore / iOS Keychain / Linux
  # Secret Service / Windows Credential Manager). 9.x line: compatible with
  # our SDK constraint and ships platform_interface ^1.1 whose MethodChannel
  # protocol this adapter pins.
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
